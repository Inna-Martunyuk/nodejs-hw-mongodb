tags:
  - Auth
summary: Send password reset email
operationId: sendResetEmail
description: Sends an email with password reset instructions.
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/requestResetPassword.yaml'
responses:
  '200':
    description: Email sent
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: Reset email sent
  '400':
    $ref: '../../components/responses/400.yaml'
