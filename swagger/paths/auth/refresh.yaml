tags:
  - Auth
summary: Refresh access token
operationId: refreshToken
description: Get a new access token using a refresh token stored in cookies.
responses:
  '200':
    description: New token generated
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  '401':
    $ref: '../../components/responses/401.yaml'

